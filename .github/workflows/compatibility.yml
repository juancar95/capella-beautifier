name: Capella compatibility
on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
  runtime:
    runs-on: macos-14
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        capella: ['7.0.0', '7.0.1', '7.1.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download and verify official Capella
        env:
          CAPELLA_VERSION: ${{ matrix.capella }}
        run: |
          python3 - <<'PY'
          import hashlib, os, platform, re, tarfile, urllib.request
          from pathlib import Path
          version = os.environ['CAPELLA_VERSION']
          arch = 'aarch64' if platform.machine() == 'arm64' else 'x86_64'
          base = f'https://download.eclipse.org/capella/core/products/releases/{version}/'
          with urllib.request.urlopen(base, timeout=60) as r:
              index = r.read().decode()
          name = re.search(r'capella-' + re.escape(version) + r'[^<>\s\"\x27]*-macosx-cocoa-' + arch + r'\.tar\.gz', index).group()
          checksum_url = 'https://www.eclipse.org/downloads/sums.php?file=/capella/core/products/releases/' + version + '/' + name + '&type=sha512'
          with urllib.request.urlopen(checksum_url, timeout=60) as r:
              expected = r.read().decode().split()[0]
          urllib.request.urlretrieve(base + name, 'capella.tar.gz')
          assert hashlib.sha512(Path('capella.tar.gz').read_bytes()).hexdigest() == expected
          with tarfile.open('capella.tar.gz') as archive:
              archive.extractall('capella-runtime', filter='data')
          app = next(Path('capella-runtime').glob('*.app'))
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'CAPELLA_HOME={app.resolve()}/Contents/Eclipse\n')
          PY
      - name: Fetch checksum-pinned dependencies
        run: python3 scripts/fetch-test-dependencies.py '${{ matrix.capella }}' dependencies
      - name: Build plugin
        run: ./scripts/build-macos.sh
      - name: Resolve complete package and check API linkage
        run: ./scripts/check-bundle-compatibility.sh "$CAPELLA_HOME" dependencies dist/capella-beautify-1.0.4.jar resolved
      - name: Execute ELK layout regression cases
        run: ./scripts/check-elk-layout.sh "$CAPELLA_HOME" dependencies
