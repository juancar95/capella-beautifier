name: Capella compatibility
on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
  runtime:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        capella: ['7.0.0', '7.0.1', '7.1.0']
        os: [macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and verify official Capella
        shell: bash
        env:
          CAPELLA_VERSION: ${{ matrix.capella }}
        run: |
          python3 - <<'PY'
          import hashlib, os, platform, re, tarfile, urllib.request, zipfile
          from pathlib import Path
          version = os.environ['CAPELLA_VERSION']
          arch = 'aarch64' if platform.machine() == 'arm64' else 'x86_64'
          base = f'https://download.eclipse.org/capella/core/products/releases/{version}/'
          with urllib.request.urlopen(base, timeout=60) as r:
              index = r.read().decode()
          suffix = 'win32-win32-x86_64.zip' if os.name == 'nt' else f'macosx-cocoa-{arch}.tar.gz'
          name = re.search(r'capella-' + re.escape(version) + r'[^<>\s\"\x27]*-' + re.escape(suffix), index).group()
          checksum_url = 'https://www.eclipse.org/downloads/sums.php?file=/capella/core/products/releases/' + version + '/' + name + '&type=sha512'
          with urllib.request.urlopen(checksum_url, timeout=60) as r:
              expected = r.read().decode().split()[0]
          urllib.request.urlretrieve(base + name, 'capella-download')
          assert hashlib.sha512(Path('capella-download').read_bytes()).hexdigest() == expected
          if os.name == 'nt':
              with zipfile.ZipFile('capella-download') as archive:
                  archive.extractall('capella-runtime')
          else:
              with tarfile.open('capella-download') as archive:
                  archive.extractall('capella-runtime', filter='data')
          analysis = next(Path('capella-runtime').rglob('org.polarsys.capella.core.sirius.analysis_*.jar'))
          eclipse = analysis.parent.parent
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'CAPELLA_HOME={eclipse.resolve()}\n')
          PY
      - name: Fetch checksum-pinned dependencies
        run: python3 scripts/fetch-test-dependencies.py '${{ matrix.capella }}' dependencies
      - name: Build plugin (macOS)
        if: runner.os == 'macOS'
        run: ./scripts/build-macos.sh
      - name: Build plugin (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: scripts\build-windows.bat
      - name: Resolve complete package and check API linkage
        run: python scripts/compatibility/runtime-check.py bundles "${{ env.CAPELLA_HOME }}" dependencies dist/capella-beautify-1.0.4.jar resolved
      - name: Execute ELK layout regression cases
        run: python scripts/compatibility/runtime-check.py elk "${{ env.CAPELLA_HOME }}" dependencies
      - name: Packaging and installer regression checks
        run: python -m unittest discover -s tests -v
